name: Publish to npm and dispatch to consumers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing to npm
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine previous tag
        id: previous
        run: |
          CURRENT="${{ steps.version.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^$CURRENT$" | head -n 1)
          if [ -z "$PREV" ]; then PREV="v0.0.0"; fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Compute bump type
        id: bump
        run: |
          BUMP=$(node .github/scripts/bump-type.mjs \
            "${{ steps.previous.outputs.previous }}" \
            "${{ steps.version.outputs.tag }}")
          echo "bump_type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gate the release itself, not just PRs: build-check only runs on pull
      # requests, so a direct push to main would otherwise reach npm untested —
      # and a bug here fans out to every consumer through the autobump matrix.
      - name: Test
        run: npm test

      - name: Publish to npm (via OIDC trusted publishing)
        run: npm publish --access public

      # `npm publish` returns before the version can be installed — npm says so
      # itself: "Your package is being processed and may take a few minutes to
      # become available." The dispatch below reaches seven consumers that each
      # run `npm install @empoweredvote/ev-ui@<version>` within seconds of the
      # event, so without this wait they all die on ETARGET while this run still
      # reports green and nothing looks wrong until someone checks a consumer.
      # That is exactly what happened to 0.13.0: published 21:19:19, readable
      # ~21:20:40, and all seven bump jobs failed at 21:19:29.
      - name: Wait for the registry to serve the new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TIMEOUT: '900'
        run: |
          PKG=$(node -p "require('./package.json').name")
          DEADLINE=$(( SECONDS + TIMEOUT ))
          ATTEMPT=0
          # --prefer-online so a cached packument cannot answer for the registry.
          until npm view "$PKG@$VERSION" version --prefer-online >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::$PKG@$VERSION was published, but the registry still does not serve it ${TIMEOUT}s later. Holding back the consumer dispatch rather than sending seven jobs into ETARGET — re-run this job once npm catches up."
              exit 1
            fi
            ATTEMPT=$(( ATTEMPT + 1 ))
            echo "attempt $ATTEMPT: registry has not caught up yet, waiting 10s"
            sleep 10
          done
          # The packument listing the version is not quite the consumer's test:
          # it then fetches the tarball. Check that too, so a half-propagated
          # release cannot pass this gate.
          TARBALL=$(npm view "$PKG@$VERSION" dist.tarball --prefer-online)
          curl -fsSI "$TARBALL" >/dev/null
          echo "$PKG@$VERSION is installable after ~${SECONDS}s ($TARBALL)"

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - CompassV2
          - essentials
          - read-rank
          - civic-spaces
          - treasury-tracker
          - empowered-badges
          - Civic-Trivia-Championships
    steps:
      - name: Mint installation token for ${{ matrix.consumer }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: EmpoweredVote
          repositories: ${{ matrix.consumer }}

      - name: Dispatch ev-ui-published to ${{ matrix.consumer }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: EmpoweredVote/${{ matrix.consumer }}
          event-type: ev-ui-published
          client-payload: |
            {
              "version": "${{ needs.publish.outputs.version }}",
              "bump_type": "${{ needs.publish.outputs.bump_type }}"
            }
